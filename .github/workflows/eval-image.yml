name: eval-image
on:
  push:
    branches: [ eval-trust-override ]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build webapp jar (with tests)
        run: mvn -B -ntp -pl phoss-ap-webapp -am package
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build & push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.eval
          push: true
          tags: ghcr.io/nocorenl/phoss-ap:eval-${{ github.sha }}
          provenance: false
      - name: Record digest
        run: |
          echo "Image: ghcr.io/nocorenl/phoss-ap:eval-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
